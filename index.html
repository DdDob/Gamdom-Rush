<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Gamdom Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07051a">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07051a;--ink:#fff;--g:#19ff8c;--p:#b44bff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;font-family:Orbitron,'Arial Black',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
body{position:relative}
#c{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(8,4,40,.55),rgba(4,2,20,.9))}
.ov.hide{display:none}
.panel{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:420px;width:100%}
.brand{display:flex;align-items:center;gap:12px;justify-content:center}
.lg{width:clamp(54px,15vw,84px);height:auto;filter:drop-shadow(0 0 14px rgba(25,255,140,.65));animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.title{font-weight:800;font-style:italic;font-size:clamp(26px,8.4vw,48px);letter-spacing:1px;line-height:1;text-align:left}
.title span{display:block;background:linear-gradient(90deg,#fff,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.title b{display:block;background:linear-gradient(90deg,var(--g),#2fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:6px}
p{margin:0;font-size:12px;opacity:.75;max-width:340px;line-height:1.5}
.nl{font-size:10px;letter-spacing:3px;opacity:.7;margin-top:4px}
#nm{width:min(300px,86vw);box-sizing:border-box;font:800 20px Orbitron,sans-serif;text-align:center;color:#fff;padding:13px 16px;border-radius:14px;border:2px solid rgba(25,255,140,.4);background:rgba(4,20,22,.75);outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 0 18px rgba(25,255,140,.08);transition:border-color .2s,box-shadow .2s}
#nm::placeholder{color:rgba(255,255,255,.28);font-weight:600;font-size:14px}
#nm:focus{border-color:var(--g);box-shadow:0 0 22px rgba(25,255,140,.4),inset 0 0 18px rgba(25,255,140,.1)}
#nm.shake{animation:sh .4s;border-color:#ff3355}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{font-size:10px;opacity:.55;margin-top:-4px}
.pick{font-size:10px;letter-spacing:3px;opacity:.7;margin-top:4px}
#cars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.car{width:100px;padding:8px 4px 10px;border:2px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;font:600 11px Orbitron,sans-serif;cursor:pointer}
.car canvas{display:block;width:92px;height:54px;margin:0 auto 4px}
.car small{display:block;opacity:.65;margin-top:4px;font-size:9px}
.car.on{border-color:var(--c);background:rgba(255,255,255,.12);box-shadow:0 0 18px -4px var(--c)}
.btn{font:800 16px Orbitron,sans-serif;padding:14px 34px;border:0;border-radius:40px;background:linear-gradient(90deg,var(--g),#2fe0ff);color:#04140c;cursor:pointer;box-shadow:0 0 24px rgba(25,255,140,.5);transition:opacity .2s,filter .2s}
.btn.off{opacity:.45;filter:saturate(.5);box-shadow:none}
.btn.alt{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;font-size:12px;padding:11px 22px;border:1px solid rgba(255,255,255,.25)}
.big{font-weight:800;font-size:clamp(28px,9vw,50px);font-style:italic;background:linear-gradient(90deg,#fff,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
#eN{font-weight:800;font-size:clamp(16px,5vw,22px);color:var(--g);letter-spacing:2px}
#eL{display:flex;flex-direction:column;gap:3px;width:min(260px,80vw)}
#eL .row{display:flex;align-items:center;gap:8px;font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.06);text-align:left}
#eL .row b{width:14px;color:#ffd23b}
#eL .row i{width:9px;height:9px;border-radius:50%}
#eL .row.me{background:linear-gradient(90deg,var(--g),rgba(25,255,140,.25));color:#04140c}
#eL .row.me b{color:#04140c}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui" class="ov"><div class="panel">
 <div class="brand">
  <svg class="lg" viewBox="100 80 200 240" aria-label="Gamdom logo"><g stroke-width=".9" stroke-linejoin="round">
   <polygon points="200,90 227,103 227,139 259,153 259,121 288,134 288,203 200,166" fill="#00cc66" stroke="#00cc66"/>
   <polygon points="200,90 173,103 173,139 141,153 141,121 112,134 112,203 200,166" fill="#00ff87" stroke="#00ff87"/>
   <polygon points="200,199 260,226 260,282 200,309" fill="#00cc66" stroke="#00cc66"/>
   <polygon points="200,199 140,226 140,282 200,309" fill="#00ff87" stroke="#00ff87"/></g></svg>
  <div class="title"><span>GAMDOM</span><b>RUSH</b></div>
 </div>
 <p>Three laps through a neon night city against seven rivals.</p>
 <label class="nl" for="nm">RACER NAME</label>
 <input id="nm" type="text" maxlength="12" placeholder="Type your name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
 <div class="hint">This is how you'll appear on the leaderboard</div>
 <div class="pick">PICK YOUR CAR</div>
 <div id="cars"></div>
 <button class="btn off" id="go">Start race</button>
 <p>Hold the left or right side of the screen to steer. Hold the Nitro button to boost. Keyboard: arrows and space.</p>
</div></div>
<div id="end" class="ov hide"><div class="panel">
 <div class="big" id="eT"></div><div id="eN"></div><p id="eS"></p><div id="eL"></div>
 <button class="btn" id="again">Race again</button><button class="btn alt" id="chg">Change name or car</button>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),F="'Orbitron','Arial Black',sans-serif",TAU=Math.PI*2;
let W,H,dpr,SX;
const $=id=>document.getElementById(id);
// ---------- logo (traced from the Gamdom mark) ----------
const mir=p=>p.map(([x,y])=>[400-x,y]),ov=p=>p.map(([x,y])=>[x==200?200.8:x,y]);
const CRL=[[200,90],[173,103],[173,139],[141,153],[141,121],[112,134],[112,203],[200,166]],CBL=[[200,199],[140,226],[140,282],[200,309]];
const CRR=mir(CRL),CBR=mir(CBL);
function drawLogo(c,cx,cy,h,lt,dk){const s=h/221;
 const poly_=(pts,col)=>{c.fillStyle=col;c.beginPath();pts.forEach(([x,y],i)=>{const X=cx+(x-200)*s,Y=cy+(y-199.5)*s;i?c.lineTo(X,Y):c.moveTo(X,Y)});c.closePath();c.fill()};
 poly_(CRR,dk);poly_(CBR,dk);poly_(ov(CRL),lt);poly_(ov(CBL),lt)}
function mkSprite(px,lt,dk,glow,blur){const pad=Math.round(px*.22),sz=px+pad*2,cc=document.createElement('canvas');cc.width=cc.height=sz;const g=cc.getContext('2d');
 if(glow){g.shadowColor=glow;g.shadowBlur=blur}drawLogo(g,sz/2,sz/2,px,lt,dk);cc.px=px;return cc}
const SPg=mkSprite(192,'#00ff87','#00cc66','#19ff8c',26);
function sprite(c,sp,cx,cy,h,al){const s=sp.width*h/sp.px;if(al!=null)c.globalAlpha=al;c.drawImage(sp,cx-s/2,cy-s/2,s,s);if(al!=null)c.globalAlpha=1}
(()=>{const q=n=>n.map(p=>p.join(' ')).join(' L');const l=document.createElement('link');l.rel='icon';
 l.href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 60 240 280"><rect x="80" y="60" width="240" height="280" rx="46" fill="#0a1f20"/><path fill="#00ff87" d="M${q(CRL)}ZM${q(CBL)}Z"/><path fill="#00cc66" d="M${q(CRR)}ZM${q(CBR)}Z"/></svg>`);document.head.appendChild(l)})();
// ---------- helpers ----------
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`};
const mkR=s=>()=>{s=(s*16807)%2147483647;return s/2147483647};
const hs=(a,b,c)=>{const s=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return s-Math.floor(s)};
function poly(c,a){c.beginPath();c.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.closePath()}
function rrp(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
// ---------- track ----------
const SEG=200,RW=2200,DRAW=100,CAMH=1000,CD=.84,CZ=840,TOP=7000,LAPS=3;
const secs=[[30,0],[50,2.2],[25,0],[60,-3],[20,0],[45,3.5],[30,-1.5],[50,2],[25,0],[70,-2.8],[30,0],[40,3],[35,-2],[30,0]];
const segs=[];secs.forEach(([n,c])=>{n=Math.round(n*2.2);for(let i=0;i<n;i++){const t=i/n;segs.push({c:c*.7*Math.min(1,t*6,(1-t)*6)})}});
const N=segs.length,L=N*SEG,zOf=d=>((d%L)+L)%L,wd=d=>{d=zOf(d);return d>L/2?d-L:d};
const GATES=[Math.floor(N*.25),Math.floor(N*.5),Math.floor(N*.75)];
let ang=0,mx0=0,my0=0;const raw=[];segs.forEach(s=>{ang+=s.c*.006;mx0+=Math.cos(ang);my0+=Math.sin(ang);raw.push([mx0,my0])});
raw.forEach((p,i)=>{p[0]-=i/N*mx0;p[1]-=i/N*my0});
const xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),sp0=Math.max(Math.max(...xs)-x0,Math.max(...ys)-y0)||1;
const mp=raw.map(p=>[(p[0]-x0)/sp0,(p[1]-y0)/sp0]);
const defs=[{n:'VOLT',col:'#19ff8c',mx:1,hd:1,tag:'Balanced'},{n:'PULSE',col:'#b44bff',mx:1.05,hd:.8,tag:'Top speed'},{n:'BLAZE',col:'#ff9a2e',mx:.96,hd:1.25,tag:'Handling'}];
const nm=['NovaRacer','SpeedDemon','CryptoRacer','RacerX','TurboMax','FlameDrive','VoltKing'],ac=['#ff3b6b','#ffd23b','#3bd5ff','#ff6bf0','#ff7a3b','#9dff3b','#c9a8ff'];
let sel=0,st='menu',P,AI,cars,cd=0,tm=0,goT=0,fin=false,bg=0,best=null,rank=1,order=[],pname='',lapPrev=1,lapT=0,nitFx=0;
try{best=+localStorage.getItem('gr_best')||+localStorage.getItem('vr_best')||null}catch(e){}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(2).padStart(5,'0');
function init(){
 const d=defs[sel];P={n:pname||'You',col:d.col,d,dist:0,x:0,sp:0,nit:1,steer:0,on:false};
 const slots=[0,1,2,3,4,6,7];
 AI=nm.map((n,i)=>{const s=slots[i];return{n,col:ac[i],dist:(5-s)*450,x:s%2?.5:-.5,sp:0,base:TOP*(.88+Math.random()*.1),lane:0,lt:1+Math.random()*2}});
 P.x=.5;cars=[P,...AI];order=cars.slice().sort((a,b)=>b.dist-a.dist);rank=order.indexOf(P)+1;fin=false;tm=0;bg=0;lapPrev=1;lapT=0}
// ---------- input ----------
const ptrs=new Map();let kl=0,kr=0,kn=false;
const NX=()=>W-70,NY=()=>H-168,TOUCH=matchMedia('(pointer:coarse)').matches;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY})});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY})});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,e=>ptrs.delete(e.pointerId)));
const typing=e=>e.target&&e.target.tagName=='INPUT';
addEventListener('keydown',e=>{if(typing(e))return;const k=e.key;if(k==' '||k.startsWith('Arrow'))e.preventDefault();if(k=='ArrowLeft'||k=='a')kl=1;if(k=='ArrowRight'||k=='d')kr=1;if(k==' '||k=='Shift')kn=true});
addEventListener('keyup',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')kl=0;if(k=='ArrowRight'||k=='d')kr=0;if(k==' '||k=='Shift')kn=false});
function getInp(){let s=kr-kl,n=kn;ptrs.forEach(p=>{if(Math.hypot(p.x-NX(),p.y-NY())<55)n=true;else s+=p.x<W/2?-1:1});return{s:Math.max(-1,Math.min(1,s)),n}}
const seg_=c=>segs[Math.floor(zOf(c.dist)/SEG)%N];
const autoSteer=s=>Math.max(-1,Math.min(1,-P.x*1.5+s.c*.5));
function upd(dt){
 const race=st=='race',ctrl=race&&!fin,s=seg_(P),spc=P.sp/TOP,inp=ctrl?getInp():null;
 P.steer+=((inp?inp.s:autoSteer(s))-P.steer)*Math.min(1,dt*9);
 let mx=TOP*P.d.mx;P.on=false;
 if(inp&&inp.n&&P.nit>0){P.on=true;mx*=1.4;P.nit=Math.max(0,P.nit-dt*.25)}else P.nit=Math.min(1,P.nit+dt*.05);
 if(!ctrl)mx=fin?TOP*.3:4200;
 if(Math.abs(P.x)>1.05)mx*=.45;
 if(P.sp<mx)P.sp=Math.min(mx,P.sp+(P.on?9000:3500)*dt);else P.sp=Math.max(mx,P.sp-6000*dt);
 P.x+=P.steer*dt*P.d.hd*2.1*Math.min(1,P.sp/3000);P.x-=dt*2*spc*spc*s.c*.34;
 P.x=Math.max(-1.28,Math.min(1.28,P.x));P.dist+=P.sp*dt;bg+=s.c*spc*dt*70;
 AI.forEach(a=>{const q=seg_(a);let tg=a.base*(1-Math.abs(q.c)*.03);const g=wd(a.dist-P.dist);if(g<-2500)tg*=1.07;if(g>3500)tg*=.93;
  a.lt-=dt;if(a.lt<0){a.lane=Math.random()*1.4-.7;a.lt=2+Math.random()*3}
  let w=a.lane;cars.forEach(o=>{if(o===a)return;const d=wd(o.dist-a.dist);if(d>0&&d<1500&&Math.abs(o.x-a.x)<.5)w=o.x>0?o.x-.7:o.x+.7});
  a.sp+=(tg-a.sp)*Math.min(1,dt*1.5);a.x+=(w-a.x)*Math.min(1,dt*1.6);a.dist+=a.sp*dt});
 if(race)AI.forEach(a=>{const d=wd(a.dist-P.dist),dx=a.x-P.x;if(Math.abs(d)<380&&Math.abs(dx)<.34){if(d>0)P.sp=Math.min(P.sp,a.sp*.92);else a.sp=Math.min(a.sp,P.sp*.95);P.x+=(dx>0?-1:1)*dt*1.6;a.x+=(dx>0?1:-1)*dt*1.6}});
 order=cars.slice().sort((a,b)=>b.dist-a.dist);if(!fin)rank=order.indexOf(P)+1;
 if(race&&!fin){tm+=dt;const ln=Math.floor(P.dist/L)+1;if(ln>lapPrev&&ln<=LAPS){lapPrev=ln;lapT=1.8}
  if(P.dist>=LAPS*L){fin=true;st='done';endScreen()}}}
function endScreen(){
 const nb=!best||tm<best;if(nb){best=tm;try{localStorage.setItem('gr_best',tm)}catch(e){}}
 $('eT').textContent=rank==1?'Victory!':'Finished P'+rank+'/8';
 $('eN').textContent=pname;
 $('eS').textContent='Time '+fmt(tm)+(nb?' · New best!':' · Best '+fmt(best));
 const lst=$('eL');lst.innerHTML='';
 order.forEach((c,i)=>{const r=document.createElement('div');r.className='row'+(c===P?' me':'');const a=document.createElement('b'),d=document.createElement('i'),s=document.createElement('span');a.textContent=i+1;d.style.background=c.col;s.textContent=c.n;r.append(a,d,s);lst.appendChild(r)});
 setTimeout(()=>$('end').classList.remove('hide'),900)}
// ---------- prerendered scenery ----------
let far,near,cliffs,vig,sc=1;
const TWU=2400;
function paintFar(g,base){const R=mkR(11),list=[];let x=0;
 while(x<TWU-50){const w=26+R()*50;list.push({x,w,h:70+R()*190,t:R()});x+=w+R()*6}
 list[list.length-1].w=TWU-list[list.length-1].x;
 list.forEach((b,i)=>{const y=base-b.h,gr=g.createLinearGradient(0,y,0,base);gr.addColorStop(0,'#2a1a86');gr.addColorStop(1,'#3a1c9a');g.fillStyle=gr;g.fillRect(b.x,y,b.w+1,b.h+2);
  if(b.t>.72){g.fillRect(b.x+b.w*.45,y-30,2.5,30);g.fillStyle='#ff4f8a';g.fillRect(b.x+b.w*.45-.5,y-33,3.5,3)}
  g.fillStyle='rgba(255,170,240,.35)';for(let r=0;r<b.h/14;r++)for(let c=0;c<Math.floor(b.w/8);c++)if(hs(i,r,c)>.72)g.fillRect(b.x+3+c*8,y+6+r*14,3,3);
  g.fillStyle='rgba(140,210,255,.3)';g.fillRect(b.x,y,b.w,1.5)})}
function needle(g,base,nx,hh){const top=base-hh;
 g.fillStyle='#0b0a34';g.beginPath();g.moveTo(nx-10,base);g.lineTo(nx-3.5,top+70);g.lineTo(nx+3.5,top+70);g.lineTo(nx+10,base);g.fill();
 g.fillRect(nx-1.3,top-22,2.6,94);
 const dy=top+86;g.fillStyle='#1a1370';g.beginPath();g.ellipse(nx,dy,38,9,0,0,TAU);g.fill();
 g.save();g.shadowColor='#3bd5ff';g.shadowBlur=10;g.strokeStyle='#3bd5ff';g.lineWidth=1.8;g.beginPath();g.ellipse(nx,dy,38,9,0,0,TAU);g.stroke();g.restore();
 g.fillStyle='#ffe9a8';for(let k=-5;k<=5;k++)g.fillRect(nx+k*6.5-1,dy-1.5,2,3);
 g.save();g.shadowColor='#ff4fd8';g.shadowBlur=18;g.fillStyle='#ff4fd8';g.beginPath();g.arc(nx,top-22,3.6,0,TAU);g.fill();g.restore()}
function paintNear(g,base){
 const R=mkR(5),list=[];
 [[700,330,130],[1890,350,150]].forEach(([ax,rx,ry])=>{g.save();g.lineCap='round';
  g.strokeStyle='#07061f';g.lineWidth=15;g.beginPath();g.ellipse(ax,base,rx,ry,0,Math.PI,TAU);g.stroke();
  g.shadowColor='#3bd5ff';g.shadowBlur=14;g.strokeStyle='#3bd5ff';g.lineWidth=3;g.beginPath();g.ellipse(ax,base,rx,ry,0,Math.PI,TAU);g.stroke();
  g.shadowColor='#ff4fd8';g.strokeStyle='#ff4fd8';g.lineWidth=1.6;g.beginPath();g.ellipse(ax,base,rx-9,ry-6,0,Math.PI,TAU);g.stroke();g.restore()});
 let x=0;while(x<TWU-40){const bb=R()<.1,w=bb?70+R()*18:34+R()*58,pc=R();list.push({x,w,h:bb?200+R()*60:40+R()*165,c:pc<.4?'#19ff8c':pc<.7?'#3bd5ff':'#ff4fd8',bb,st:!bb&&R()<.25,ant:!bb&&R()<.2,edge:R()<.35,seed:Math.floor(R()*100)});x+=w+R()*8}
 const lb=list[list.length-1];lb.w=TWU-lb.x;if(lb.w<50)lb.bb=false;
 list.forEach(b=>{const y=base-b.h,x=b.x,w=b.w;
  const gr=g.createLinearGradient(0,y,0,base);gr.addColorStop(0,'#1a1252');gr.addColorStop(.5,'#0c0a33');gr.addColorStop(1,'#08071f');g.fillStyle=gr;g.fillRect(x,y,w,b.h+2);
  g.fillStyle='rgba(255,255,255,.05)';g.fillRect(x,y,w*.12,b.h);
  if(b.st){g.fillStyle='#0f0b3a';g.fillRect(x+w*.2,y-26,w*.6,27);g.fillStyle=b.c;g.fillRect(x+w*.2,y-26,w*.6,2)}
  if(b.ant){g.fillStyle='#2b2470';g.fillRect(x+w*.5-1,y-34,2,34);g.save();g.shadowColor='#ff3355';g.shadowBlur=8;g.fillStyle='#ff3355';g.beginPath();g.arc(x+w*.5,y-35,2.2,0,TAU);g.fill();g.restore()}
  g.save();g.shadowColor=b.c;g.shadowBlur=12;g.fillStyle=b.c;g.fillRect(x,y,w,2.5);if(b.edge)g.fillRect(x+w-2,y,2,b.h);g.restore();
  if(b.bb){const px=x+4,pw=w-8,py=y+14,ph=Math.min(b.h*.5,pw*1.5);
   const pg=g.createLinearGradient(0,py,0,py+ph);pg.addColorStop(0,'#052a24');pg.addColorStop(1,'#0a6a4c');g.fillStyle=pg;g.fillRect(px,py,pw,ph);
